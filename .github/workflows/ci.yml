name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Socle — Marqueurs de conflit non résolus
        run: |
          echo "Recherche des marqueurs de conflit non résolus..."
          C1="<<<"
          C2="<<<"
          CO="${C1}${C2}<"
          C3=">>>"
          C4=">>>"
          CC="${C3}${C4}>"
          if grep -rn --exclude-dir=.git -E "^(${CO}|${CC})" .; then
            echo "ERREUR : Marqueurs de conflit non résolus détectés."
            exit 1
          fi
          echo "Aucun marqueur de conflit trouvé."

      - name: Socle — Marqueur de blocage explicite
        run: |
          HOLD="FIXME"
          HOLD="${HOLD}_BLOCK_CI"
          echo "Recherche du marqueur de blocage..."
          if grep -r --exclude-dir=.git -F "$HOLD" .; then
            echo "ERREUR : Marqueur de blocage détecté ($HOLD)."
            exit 1
          fi
          echo "Aucun marqueur de blocage trouvé."

      - name: Projet — Version de Node épinglée
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # Cache des paquets npm, seulement quand package-lock.json existe :
          # sans lui, setup-node échouerait au lieu de continuer.
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Projet — Cache de construction Next.js
        if: hashFiles('next.config.*') != ''
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          # Nouveau cache quand les paquets ou les sources changent ; sinon, reprise du précédent.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Projet — Installation (npm)
        id: installation
        run: |
          if [ ! -f package.json ]; then
            echo "Aucun package.json : rien à installer."
            exit 0
          fi
          if [ -f package-lock.json ]; then
            echo "package-lock.json présent : npm ci."
            npm ci
          else
            echo "Pas de package-lock.json : npm install."
            npm install
          fi

      - name: Projet — Build
        run: |
          if [ -f package.json ] && jq -e '.scripts.build' package.json >/dev/null 2>&1; then
            echo "Script build présent : npm run build."
            npm run build
          else
            echo "Pas de script build (ou pas de package.json) : rien à construire."
          fi

      # Tests et lint passent même si le build échoue : un seul passage de CI donne
      # toutes les erreurs. Jamais sans installation réussie, jamais après une annulation.
      - name: Projet — Tests
        if: ${{ !cancelled() && steps.installation.outcome == 'success' }}
        run: |
          if [ -f package.json ] && jq -e '.scripts.test' package.json >/dev/null 2>&1; then
            echo "Script test présent : npm test."
            npm test
          else
            echo "Pas de script test (ou pas de package.json) : rien à tester."
          fi

      - name: Projet — Lint
        if: ${{ !cancelled() && steps.installation.outcome == 'success' }}
        run: |
          if [ -f package.json ] && jq -e '.scripts.lint' package.json >/dev/null 2>&1; then
            echo "Script lint présent : npm run lint."
            npm run lint
          else
            echo "Pas de script lint (ou pas de package.json) : rien à vérifier."
          fi
